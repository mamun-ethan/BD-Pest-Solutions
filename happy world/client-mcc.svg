  <!-- Typography -->
  <text x="75" y="28" font-family="'Roboto', sans-serif" font-size="14" font-weight="900" fill="#111827" letter-spacing="0.5">MIRZAPUR</text>
  <text x="75" y="44" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#800000" letter-spacing="0.8">CADET COLLEGE</text>
  <text x="75" y="56" font-family="'Roboto', sans-serif" font-size="8.5" font-weight="500" fill="#6B7280" letter-spacing="0.4">ESTD 1963 • BANGLADESH</text>
</svg>
