    <circle cx="30" cy="18" r="4" fill="#D4AF37"/>
    <!-- Star & Book -->
    <polygon points="30,22 32,27 37,27 33,30 35,35 30,32 25,35 27,30 23,27 28,27" fill="#FBBF24"/>
